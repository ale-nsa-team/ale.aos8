---
# Generated from the module examples: every documented example runs here.
- name: Prepare the switch
  ansible.netcommon.cli_command:
    command: '{{ item }}'
  loop:
    - vrf default
    - ip bgp admin-state disable
    - no ip bgp neighbor 10.10.10.254
    - no ip bgp neighbor 10.10.10.253
  changed_when: false
  failed_when: false
- name: Run the test cases and always restore the switch
  block:
    - name: Configure BGP with one neighbor
      ale.aos8.aos8_bgp:
        config:
          as_number: '65001'
          bgp_admin_state: enable
          neighbor:
            - neighbor_address: 10.10.10.254
              remote_as: '65002'
              neighbor_admin_state: enable
        state: merged
      register: result
    - name: Check the commands sent
      ansible.builtin.assert:
        that:
          - result is changed
          - '''ip bgp neighbor 10.10.10.254'' in result.commands'
          - '''ip bgp neighbor 10.10.10.254 remote-as 65002'' in result.commands'
          - '''ip bgp neighbor 10.10.10.254 admin-state enable'' in result.commands'
          - '''ip bgp admin-state enable'' in result.commands'
        fail_msg: '{{ result | to_json }}'
    - name: 'Configure BGP with one neighbor (run again: nothing changes)'
      ale.aos8.aos8_bgp:
        config:
          as_number: '65001'
          bgp_admin_state: enable
          neighbor:
            - neighbor_address: 10.10.10.254
              remote_as: '65002'
              neighbor_admin_state: enable
        state: merged
      register: result
    - name: Check that the second run changed nothing
      ansible.builtin.assert:
        that:
          - result is not changed
          - result.commands == []
        fail_msg: '{{ result | to_json }}'
    - name: Disable a neighbor (peer is an alias of neighbor_address)
      ale.aos8.aos8_bgp:
        config:
          neighbor:
            - peer: 10.10.10.254
              neighbor_admin_state: disable
        state: merged
      register: result
    - name: Check the commands sent
      ansible.builtin.assert:
        that:
          - result is changed
          - result.commands == ['ip bgp neighbor 10.10.10.254 admin-state disable']
        fail_msg: '{{ result | to_json }}'
    - name: 'Disable a neighbor (peer is an alias of neighbor_address) (run again: nothing changes)'
      ale.aos8.aos8_bgp:
        config:
          neighbor:
            - peer: 10.10.10.254
              neighbor_admin_state: disable
        state: merged
      register: result
    - name: Check that the second run changed nothing
      ansible.builtin.assert:
        that:
          - result is not changed
          - result.commands == []
        fail_msg: '{{ result | to_json }}'
    - name: Replace the neighbors
      ale.aos8.aos8_bgp:
        config:
          as_number: '65001'
          bgp_admin_state: enable
          neighbor:
            - neighbor_address: 10.10.10.253
              remote_as: '65003'
        state: replaced
      register: result
    - name: Check the commands sent
      ansible.builtin.assert:
        that:
          - result is changed
          - result.commands == ['no ip bgp neighbor 10.10.10.254', 'ip bgp neighbor 10.10.10.253', 'ip bgp neighbor 10.10.10.253 remote-as 65003']
        fail_msg: '{{ result | to_json }}'
    - name: 'Replace the neighbors (run again: nothing changes)'
      ale.aos8.aos8_bgp:
        config:
          as_number: '65001'
          bgp_admin_state: enable
          neighbor:
            - neighbor_address: 10.10.10.253
              remote_as: '65003'
        state: replaced
      register: result
    - name: Check that the second run changed nothing
      ansible.builtin.assert:
        that:
          - result is not changed
          - result.commands == []
        fail_msg: '{{ result | to_json }}'
    - name: Read the BGP configuration from the switch
      ale.aos8.aos8_bgp:
        state: gathered
      register: result
    - name: Check the gathered data
      ansible.builtin.assert:
        that:
          - result is not changed
          - 'result.gathered == {''as_number'': ''65001'', ''bgp_admin_state'': ''enable'', ''neighbor'': [{''neighbor_address'': ''10.10.10.253'', ''remote_as'': ''65003'', ''neighbor_admin_state'': ''disable''}]}'
        fail_msg: '{{ result | to_json }}'
    - name: Disable BGP and keep the neighbor
      ale.aos8.aos8_bgp:
        config:
          as_number: '65001'
          bgp_admin_state: disable
          neighbor:
            - neighbor_address: 10.10.10.253
              remote_as: '65003'
        state: overridden
      register: result
    - name: Check the commands sent
      ansible.builtin.assert:
        that:
          - result is changed
          - result.commands == ['ip bgp admin-state disable']
        fail_msg: '{{ result | to_json }}'
    - name: 'Disable BGP and keep the neighbor (run again: nothing changes)'
      ale.aos8.aos8_bgp:
        config:
          as_number: '65001'
          bgp_admin_state: disable
          neighbor:
            - neighbor_address: 10.10.10.253
              remote_as: '65003'
        state: overridden
      register: result
    - name: Check that the second run changed nothing
      ansible.builtin.assert:
        that:
          - result is not changed
          - result.commands == []
        fail_msg: '{{ result | to_json }}'
    - name: Show the commands for a BGP configuration without connecting to the switch
      ale.aos8.aos8_bgp:
        config:
          as_number: '65010'
          bgp_admin_state: enable
        state: rendered
      register: result
    - name: Check the rendered commands
      ansible.builtin.assert:
        that:
          - result is not changed
          - result.rendered == ['ip load bgp', 'ip bgp autonomous-system 65010', 'ip bgp admin-state enable']
        fail_msg: '{{ result | to_json }}'
    - name: Convert configuration lines into structured data
      ale.aos8.aos8_bgp:
        running_config: |
          ip load bgp
          ip bgp autonomous-system 65001
          ip bgp neighbor 10.10.10.2
          ip bgp neighbor 10.10.10.2 remote-as 65002
          ip bgp neighbor 10.10.10.2 admin-state enable
          ip bgp admin-state enable
        state: parsed
      register: result
    - name: Check the parsed data
      ansible.builtin.assert:
        that:
          - result is not changed
          - 'result.parsed == {''as_number'': ''65001'', ''bgp_admin_state'': ''enable'', ''neighbor'': [{''neighbor_address'': ''10.10.10.2'', ''remote_as'': ''65002'', ''neighbor_admin_state'': ''enable''}]}'
        fail_msg: '{{ result | to_json }}'
    - name: Remove every neighbor and disable BGP
      ale.aos8.aos8_bgp:
        state: deleted
      register: result
    - name: Check the commands sent
      ansible.builtin.assert:
        that:
          - result is changed
          - result.commands == ['no ip bgp neighbor 10.10.10.253']
        fail_msg: '{{ result | to_json }}'
    - name: 'Remove every neighbor and disable BGP (run again: nothing changes)'
      ale.aos8.aos8_bgp:
        state: deleted
      register: result
    - name: Check that the second run changed nothing
      ansible.builtin.assert:
        that:
          - result is not changed
          - result.commands == []
        fail_msg: '{{ result | to_json }}'
  always:
    - name: Restore the switch
      ansible.netcommon.cli_command:
        command: '{{ item }}'
      loop:
        - vrf default
      changed_when: false
      failed_when: false
